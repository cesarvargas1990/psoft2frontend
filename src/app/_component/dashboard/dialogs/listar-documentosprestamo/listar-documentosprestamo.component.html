<h4 mat-dialog-title>VISUALIZAR DOCUMENTOS</h4>

<mat-accordion>
  @for (item of plantillas_html; track item) {
    <mat-expansion-panel
      (opened)="panelOpenState = true"
      (closed)="panelOpenState = false"
    >
      <mat-expansion-panel-header>
        <mat-panel-title>
          {{ item.nombre }}
        </mat-panel-title>
      </mat-expansion-panel-header>
      <br />
      <tinymce [(ngModel)]="item.plantilla_html" [config]="config"></tinymce>
    </mat-expansion-panel>
  }
</mat-accordion>

<mat-dialog-actions> </mat-dialog-actions>
