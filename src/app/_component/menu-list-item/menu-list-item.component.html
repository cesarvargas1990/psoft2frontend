<a
  mat-list-item
  [ngStyle]="{ 'padding-left': depth * 12 + 'px' }"
  (click)="onItemSelected(item)"
  [ngClass]="{
    active: item.route ? router.isActive(item.route, true) : false,
    expanded: expanded
  }"
  class="menu-list-item"
>
  <mat-icon class="routeIcon">{{ item.iconName }}</mat-icon>
  <span class="menu-label">{{ item.displayName }}</span>
  @if (item.children && item.children.length) {
    <span class="menu-indicator">
      <mat-icon
        class="indicator-icon"
        [@indicatorRotate]="expanded ? 'expanded' : 'collapsed'"
      >
        expand_more
      </mat-icon>
    </span>
  }
</a>
@if (expanded) {
  <div>
    @for (child of item.children; track child) {
      <app-menu-list-item [item]="child" [depth]="depth + 1">
      </app-menu-list-item>
    }
  </div>
}
