<div class="example-container" [class.example-is-mobile]="mobileQuery.matches">
  <app-top-nav fxHide.xs></app-top-nav>
  <app-top-nav class="fixed-topnav" fxHide.gt-xs></app-top-nav>
  <app-loading></app-loading>
  <mat-sidenav-container class="example-sidenav-container">
    <mat-sidenav
      #appDrawer
      [mode]="mobileQuery.matches ? 'over' : 'side'"
      [fixedInViewport]="mobileQuery.matches"
      fixedTopGap="56"
      [opened]="true"
    >
      <div class="logo-container" fxFlexAlign="center">
        <app-logo *ngIf="authService.isLoggedIn()"></app-logo>
      </div>
      <mat-divider></mat-divider>
      <mat-nav-list *ngIf="authService.isLoggedIn()">
        <app-menu-list-item
          *ngFor="let item of navItems"
          [item]="item"
        ></app-menu-list-item>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <div class="loan-page">
        <section class="loan-hero card">
          <div class="card-header loan-hero-header">
            <button
              title="Volver"
              (click)="volver()"
              class="left btn btn-outline-primary btn-sm"
              mat-icon-button
              color="primary"
            >
              <mat-icon aria-label="Volver">keyboard_backspace</mat-icon>
            </button>
            <div class="loan-hero-title-wrap">
              <h2 class="loan-hero-title">Creación de préstamo</h2>
              <p class="loan-hero-subtitle">
                Complete los datos, simule cuotas y luego confirme el registro.
              </p>
            </div>
          </div>
        </section>

        <section class="card loan-form-card">
          <div class="card-body">
            <h5 class="section-title">Datos del préstamo</h5>
            <form [formGroup]="form" (ngSubmit)="submit()">
              <formly-form
                [model]="model"
                [fields]="fields"
                [options]="options"
                [form]="form"
              >
              </formly-form>

              <mat-dialog-actions class="loan-actions">
                <button
                  type="button"
                  (click)="obtenerCuotasPrestamo()"
                  title="Obtener cuotas del prestamo"
                  class="btn btn-primary submit-button"
                >
                  <mat-icon aria-label="Calcular">table_chart</mat-icon>
                  Simular cuotas
                </button>

                <button
                  *ngIf="mostrarTablaResumen && !listarDocumentosPrestamo"
                  type="button"
                  class="btn btn-primary submit-button"
                  (click)="guardarPrestamo()"
                  title="Guardar Prestamo"
                >
                  <mat-icon aria-label="Guardar">save</mat-icon>
                  Guardar préstamo
                </button>
              </mat-dialog-actions>
            </form>
          </div>
        </section>

        <section *ngIf="mostrarTablaResumen" class="card loan-result-card">
          <div class="card-body">
            <h5 class="section-title">Resultado</h5>

            <mat-tab-group animationDuration="0ms" class="loan-tabs">
              <mat-tab label="Resumen de cuotas">
                <div *ngIf="!listarDocumentosPrestamo" class="table-responsive">
                  <table class="main-table mobile-optimised table-responvive">
                    <thead>
                      <tr>
                        <th *ngFor="let header of getHeaders()">
                          {{ header }}
                        </th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let item of tableCuotasPrestamo">
                        <td
                          *ngFor="let key of getHeaders()"
                          [attr.data-th]="key"
                        >
                          {{ item[key] }}
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <div
                  *ngIf="listarDocumentosPrestamo"
                  class="empty-result-state"
                >
                  El préstamo fue registrado. Revise los documentos en la
                  pestaña "Documentos".
                </div>
              </mat-tab>

              <mat-tab label="Documentos">
                <div *ngIf="listarDocumentosPrestamo" class="documents-pane">
                  <tinymce
                    [(ngModel)]="contenidoCombinado"
                    [config]="config"
                  ></tinymce>
                </div>

                <div
                  *ngIf="!listarDocumentosPrestamo"
                  class="empty-result-state"
                >
                  Los documentos estarán disponibles después de guardar el
                  préstamo.
                </div>
              </mat-tab>
            </mat-tab-group>
          </div>
        </section>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
