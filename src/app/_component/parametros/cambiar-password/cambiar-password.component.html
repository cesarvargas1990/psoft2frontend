<div class="password-page">
  <section class="card password-card">
    <div class="card-header password-header">
      <button
        title="Volver"
        (click)="volver()"
        class="left btn btn-outline-primary btn-sm"
        mat-icon-button
        color="primary"
      >
        <mat-icon aria-label="Volver">keyboard_backspace</mat-icon>
      </button>
      <h2>Cambiar password</h2>
    </div>

    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="guardar()" class="password-form">
        <mat-form-field appearance="fill">
          <mat-label>Nuevo password</mat-label>
          <input matInput type="password" formControlName="password" />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Confirmar password</mat-label>
          <input matInput type="password" formControlName="password_confirmation" />
        </mat-form-field>

        <button type="submit" class="btn btn-primary submit-button">
          <mat-icon aria-label="Guardar">save</mat-icon>
          Guardar
        </button>
      </form>
    </div>
  </section>
</div>
